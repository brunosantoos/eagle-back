services:
  postgres:
    image: postgres:16-alpine
    container_name: eagle-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: eagle
      POSTGRES_PASSWORD: eagle
      POSTGRES_DB: eagle
    ports:
      - "5432:5432"
    volumes:
      - eagle_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eagle -d eagle"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  eagle_pgdata:
