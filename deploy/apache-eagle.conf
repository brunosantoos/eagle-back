# Apache vhosts. Coloque em /etc/apache2/sites-available/eagle.conf
# Habilite módulos: a2enmod proxy proxy_http rewrite headers ssl
# Substitua os caminhos dos certificados se forem diferentes (certbot gera por domínio).
#
# Front: eagleacademia.com.br  ->  127.0.0.1:6666 (nginx do container do frontend)
# API:   api.eagleacademia.com.br -> 127.0.0.1:3033 (backend Express/tRPC)

# ----------- FRONTEND -----------

<VirtualHost *:80>
    ServerName eagleacademia.com.br
    ServerAlias www.eagleacademia.com.br
    Redirect permanent / https://eagleacademia.com.br/
</VirtualHost>

<VirtualHost *:443>
    ServerName eagleacademia.com.br
    ServerAlias www.eagleacademia.com.br

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/eagleacademia.com.br/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/eagleacademia.com.br/privkey.pem

    ProxyPreserveHost On
    ProxyRequests Off

    ProxyPass / http://127.0.0.1:6666/
    ProxyPassReverse / http://127.0.0.1:6666/

    ErrorLog ${APACHE_LOG_DIR}/eagle-front-error.log
    CustomLog ${APACHE_LOG_DIR}/eagle-front-access.log combined
</VirtualHost>

# ----------- API -----------

<VirtualHost *:80>
    ServerName api.eagleacademia.com.br
    Redirect permanent / https://api.eagleacademia.com.br/
</VirtualHost>

<VirtualHost *:443>
    ServerName api.eagleacademia.com.br

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/api.eagleacademia.com.br/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/api.eagleacademia.com.br/privkey.pem

    ProxyPreserveHost On
    ProxyRequests Off

    # Backend cobre /trpc, /api/*, /uploads/*, /health — proxy raiz pra simplicidade.
    ProxyPass / http://127.0.0.1:3033/
    ProxyPassReverse / http://127.0.0.1:3033/

    # multer aceita 100 MB
    LimitRequestBody 104857600

    ErrorLog ${APACHE_LOG_DIR}/eagle-api-error.log
    CustomLog ${APACHE_LOG_DIR}/eagle-api-access.log combined
</VirtualHost>
